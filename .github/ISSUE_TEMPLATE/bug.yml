name: Bug
description: Report an incorrect schema, fixture, or documentation behaviour
labels: ["type:bug"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What happened and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Reproduction and evidence}
    validations: {required: true}
