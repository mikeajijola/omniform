name: Publish documentation
on:
  push:
    branches: [main]
    paths: ["docs/**", "spec/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp -R docs/* _site/
          cp -R spec _site/spec
          printf '\nSource: %s@%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> _site/index.md
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
