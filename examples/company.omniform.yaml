apiVersion: omniform.org/v1alpha1
kind: Company
metadata:
  id: acme
  name: Acme
spec:
  intent: Find and retrieve relevant company knowledge.
  providers:
    skills:
      provider: local_search_skills
    memory:
      provider: local_memory
    connectors:
      provider: local_information_sources
  capabilities:
    - id: company_search
      name: Company Search
      description: Find and retrieve relevant company knowledge.
      requires:
        - id: semantic_search
          primitiveFamily: skills
        - id: retained_company_knowledge
          primitiveFamily: memory
        - id: access_company_sources
          primitiveFamily: connectors
  operations:
    - id: search_company
      capability: company_search
      description: Search governed company knowledge.
      input: { type: object, required: [query] }
      output: { type: array }
      mutation: false
      permissions: [company_search.read]
      approval: none
      interfaces: [lily, ui, api, cli, agent, machine]
      providerDependencies: [skills, memory, connectors]
