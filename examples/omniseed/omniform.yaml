apiVersion: omniform.org/v1alpha1
kind: Company
metadata:
  id: omniseed
  name: OmniSeed
spec:
  intent: Build and operate the open Company-as-Code ecosystem.
  outcomes:
    - id: autonomous_company_platform
      description: Companies can be founded and operated from intent.
  providers:
    agents: { provider: reference_agents }
    skills: { provider: omniseed }
    connectors: { provider: reference_connectors }
    workflows: { provider: omniseed }
    schedules: { provider: reference_scheduler }
    policies: { provider: omniseed }
    observations: { provider: omniseed }
    systems: { provider: local }
    memory: { provider: local_memory }
  capabilities:
    - id: company_operating_environment
      name: Company Operating Environment
      autonomy: { mode: apply_low_risk }
      requires:
        - { id: web_application_hosting, primitiveFamily: systems }
        - { id: production_deployment, primitiveFamily: systems }
        - { id: public_endpoint, primitiveFamily: systems }
        - { id: deployment_observation, primitiveFamily: observations }
      realisation:
        resources: [omniseed_os, deployment_observation]
  resources:
    systems:
      - id: omniseed_os
        name: OmniSeed OS
        offers: [web_application_hosting, production_deployment, public_endpoint]
        spec: { runtime: local }
    observations:
      - id: deployment_observation
        name: Deployment Observation
        offers: [deployment_observation]
        spec: { type: external_state }
    agents:
      - id: company_steward
        name: Lily
        offers: [inspect_company_state, generate_plan]
        spec: { operationalIdentity: company_steward }
  operations:
    - id: get_capability
      capability: company_operating_environment
      description: Get current capability truth.
      input: { type: object, required: [capabilityId] }
      output: { type: object }
      mutation: false
      permissions: [capability.read]
      approval: none
      interfaces: [lily, ui, api, cli, agent, machine]
    - id: generate_plan
      capability: company_operating_environment
      description: Generate and persist a deterministic plan.
      input: { type: object }
      output: { type: object }
      mutation: false
      permissions: [plan.create]
      approval: none
      interfaces: [lily, ui, api, cli, agent]
    - id: apply_plan
      capability: company_operating_environment
      description: Apply approved actions from the exact reviewed plan.
      input: { type: object, required: [plan, approval] }
      output: { type: object }
      mutation: true
      permissions: [plan.apply]
      approval: required
      interfaces: [ui, api, cli, agent]
