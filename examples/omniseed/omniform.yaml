apiVersion: omniform.org/v1alpha1
kind: Company
metadata:
  id: omniseed
  name: OmniSeed
spec:
  intent: Manage software development without binding the capability to one vendor.
  outcomes:
    - id: autonomous_company_platform
      description: Companies can be founded and operated from intent.
  providers:
    agents: { provider: people_operations }
    skills: { provider: engineering_toolchain }
    connectors: { provider: github_connector }
    workflows: { provider: change_management }
    policies: { provider: governance_engine }
    observations: { provider: software_monitoring }
    memory: { provider: engineering_knowledge }
    identity: { provider: entra_identity }
  capabilities:
    - id: manage_software_development
      name: Manage Software Development
      autonomy: { mode: apply_low_risk }
      requires:
        - { id: engineering_agency, primitiveFamily: agents }
        - { id: edit_review_test_code, primitiveFamily: skills }
        - { id: repository_access, primitiveFamily: connectors }
        - { id: governed_change_process, primitiveFamily: workflows }
        - { id: required_review, primitiveFamily: policies }
        - { id: change_health_monitoring, primitiveFamily: observations }
        - { id: engineering_context, primitiveFamily: memory }
        - { id: recognised_contributors, primitiveFamily: identity }
      realisation:
        resources: [software_engineer, engineering_skills, repository_connector, change_workflow, review_policy, change_observer, engineering_history, contributor_identity]
  resources:
    agents:
      - id: software_engineer
        name: Software Engineer
        offers: [engineering_agency]
        spec: { kind: person }
    skills:
      - id: engineering_skills
        name: Engineering Skills
        offers: [edit_review_test_code]
        spec: { abilities: [edit_code, review_change, run_test, open_pull_request] }
    connectors:
      - id: repository_connector
        name: Repository Connector
        offers: [repository_access]
        spec: { boundary: source_control }
    workflows:
      - id: change_workflow
        name: Change Review Workflow
        offers: [governed_change_process]
        spec: { stages: [change, review, test, release] }
    policies:
      - id: review_policy
        name: Required Review Policy
        offers: [required_review]
        spec: { minimumReviews: 1 }
    observations:
      - id: change_observer
        name: Change Health Observer
        offers: [change_health_monitoring]
        spec: { measures: [tests, checks, pull_request_state] }
    memory:
      - id: engineering_history
        name: Engineering History
        offers: [engineering_context]
        spec: { content: [source_history, change_history] }
    identity:
      - id: contributor_identity
        name: Contributor Identity
        offers: [recognised_contributors]
        spec: { principals: [people, services] }
  operations:
    - id: get_capability
      capability: manage_software_development
      description: Get current capability truth.
      input: { type: object, required: [capabilityId] }
      output: { type: object }
      mutation: false
      permissions: [capability.read]
      approval: none
      interfaces: [lily, ui, api, cli, agent, machine]
    - id: generate_plan
      capability: manage_software_development
      description: Generate and persist a deterministic plan.
      input: { type: object }
      output: { type: object }
      mutation: false
      permissions: [plan.create]
      approval: none
      interfaces: [lily, ui, api, cli, agent]
    - id: apply_plan
      capability: manage_software_development
      description: Apply approved actions from the exact reviewed plan.
      input: { type: object, required: [plan, approval] }
      output: { type: object }
      mutation: true
      permissions: [plan.apply]
      approval: required
      interfaces: [ui, api, cli, agent]
